name: Build AkaiserEvodroid A.1

# Self-contained: this one file contains the whole AkaiserEvodroid overlay + patch script.
# It downloads the open-source Play! emulator, applies the patches and builds a signed APK.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
