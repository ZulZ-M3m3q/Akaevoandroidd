      - name: Download Play! (open source PS2 emulator)
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/jpd002/Play-.git Play-

      - name: Install the Android SDK/NDK pieces Play! itself uses
        run: |
          F=Play-/.github/workflows/build-android.yaml
          get() { grep -E "^[[:space:]]*$1:" "$F" | head -1 | sed -E "s/^[^:]*:[[:space:]]*//; s/[\"' ]//g"; }
          NDK=$(get ANDROID_NDK_VERSION); CMAKE=$(get ANDROID_CMAKE_VERSION); BT=$(get ANDROID_BUILD_TOOLS_VERSION)
          echo "Play! wants NDK=$NDK CMAKE=$CMAKE BUILD_TOOLS=$BT"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          PKGS=""
          [ -n "$NDK" ] && PKGS="$PKGS ndk;$NDK"
          [ -n "$CMAKE" ] && PKGS="$PKGS cmake;$CMAKE"
          [ -n "$BT" ] && PKGS="$PKGS build-tools;$BT"
          [ -n "$PKGS" ] && "$SDKM" $PKGS || true

      - name: Apply AkaiserEvodroid patches
        run: python3 akevo/patches/apply_patches.py Play- | tee patch.log

      - name: Build release APK (this takes a long time)
        run: |
          GRADLEW=$(find Play- -maxdepth 3 -name gradlew | head -1)
          D=$(dirname "$GRADLEW")
          cd "$D"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Error summary (only runs if the build failed)
        if: failure()
        run: |
          {
            echo "## Build error summary"
            echo '```'
            grep -n -E "What went wrong|error:|FAILED|Execution failed|Could not|No such file|undefined reference|not found|Unresolved|cannot find symbol" -A4 build.log | head -90 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Align and sign APK
        run: |
          APK=$(find Play- -path '*outputs/apk/release*' -name '*.apk' | head -1)
          echo "built: $APK"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          keytool -genkeypair -keystore ak.jks -storepass akevodroid -keypass akevodroid -alias ak -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AkaiserEvodroid"
          "$BT/apksigner" sign --ks ak.jks --ks-pass pass:akevodroid --out AkaiserEvodroid_A.1.apk aligned.apk
          "$BT/apksigner" verify AkaiserEvodroid_A.1.apk
          ls -la AkaiserEvodroid_A.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AkaiserEvodroid-A.1
          path: AkaiserEvodroid_A.1.apk

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            patch.log
            build.log
