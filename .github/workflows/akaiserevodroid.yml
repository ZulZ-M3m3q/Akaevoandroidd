name: Build AkaiserEvodroid A.1

# Needs akevo_src.zip (overlay + patch script) uploaded to the repo root next to the .github folder.
# It downloads the open-source Play! emulator, applies the patches and builds a signed APK.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Get repository files
        uses: actions/checkout@v4

      - name: Unpack AkaiserEvodroid sources
        run: |
          test -f akevo_src.zip || { echo "ERROR: akevo_src.zip is missing from the repo root. Upload it (Add file > Upload files)."; exit 1; }
          unzip -q akevo_src.zip
          ls -R akevo

      - name: Download Play! (open source PS2 emulator)
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/jpd002/Play-.git Play-

      - name: Install the Android SDK/NDK pieces Play! itself uses
        run: |
          F=Play-/.github/workflows/build-android.yaml
          get() { grep -E "^[[:space:]]*$1:" "$F" | head -1 | sed -E "s/^[^:]*:[[:space:]]*//; s/[\"' ]//g"; }
          NDK=$(get ANDROID_NDK_VERSION); CMAKE=$(get ANDROID_CMAKE_VERSION); BT=$(get ANDROID_BUILD_TOOLS_VERSION)
          echo "Play! wants NDK=$NDK CMAKE=$CMAKE BUILD_TOOLS=$BT"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          PKGS=""
          [ -n "$NDK" ] && PKGS="$PKGS ndk;$NDK"
          [ -n "$CMAKE" ] && PKGS="$PKGS cmake;$CMAKE"
          [ -n "$BT" ] && PKGS="$PKGS build-tools;$BT"
          [ -n "$PKGS" ] && "$SDKM" $PKGS || true

      - name: Apply AkaiserEvodroid patches
        run: |
          set -o pipefail
          python3 akevo/patches/apply_patches.py Play- 2>&1 | tee patch.log

      - name: Show patched gradle files
        run: grep -rn --include=build.gradle* -e mlkit -e applicationId Play- | grep -v /Dependencies/ | head -20 || true

      - name: Build release APK (this takes a long time)
        run: |
          GRADLEW=$(find Play- -maxdepth 3 -name gradlew | head -1)
          D=$(dirname "$GRADLEW")
          cd "$D"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          set -o pipefail
          cat > "$GITHUB_WORKSPACE/akevo-init.gradle" <<'INIT'
          allprojects {
            configurations.all {
              resolutionStrategy.eachDependency { d ->
                if (d.requested.group == 'org.jetbrains.kotlin' && d.requested.name.startsWith('kotlin-stdlib')) {
                  d.useVersion('1.8.22')
                }
              }
            }
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.application')) {
                ['androidx.camera:camera-core:1.3.4', 'androidx.camera:camera-camera2:1.3.4',
                 'androidx.camera:camera-lifecycle:1.3.4', 'androidx.camera:camera-view:1.3.4',
                 'com.google.mlkit:barcode-scanning:17.3.0'].each { p.dependencies.add('implementation', it) }
                println "AKEVO init: added camera + mlkit deps to project " + p.path
              }
            }
          }
          INIT
          ./gradlew assembleRelease -I "$GITHUB_WORKSPACE/akevo-init.gradle" --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Error summary (only runs if the build failed)
        if: failure()
        run: |
          {
            echo "## Build error summary"
            echo '```'
            grep -n -E "What went wrong|error:|FAILED|Execution failed|Could not|No such file|undefined reference|not found|Unresolved|cannot find symbol" -A4 build.log | head -90 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Align and sign APK
        run: |
          APK=$(find Play- -path '*outputs/apk/release*' -name '*.apk' | head -1)
          echo "built: $APK"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          keytool -genkeypair -keystore ak.jks -storepass akevodroid -keypass akevodroid -alias ak -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AkaiserEvodroid"
          "$BT/apksigner" sign --ks ak.jks --ks-pass pass:akevodroid --out AkaiserEvodroid_A.1.apk aligned.apk
          "$BT/apksigner" verify AkaiserEvodroid_A.1.apk
          ls -la AkaiserEvodroid_A.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AkaiserEvodroid-A.1
          path: AkaiserEvodroid_A.1.apk

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            patch.log
            build.log
