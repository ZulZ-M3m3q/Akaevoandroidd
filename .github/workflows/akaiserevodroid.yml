name: Build AkaiserEvodroid A.1

# Self-contained: this one file holds the whole AkaiserEvodroid overlay + patch script.
# It downloads the open-source Play! emulator, patches it (stops with a clear error if any patch fails),
# builds an arm64 APK and signs it.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack AkaiserEvodroid sources
